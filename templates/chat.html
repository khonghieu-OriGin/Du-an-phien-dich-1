{% extends "base.html" %}
{% block content %}

<div class="bg-gray-50 flex-grow flex flex-col h-[calc(100vh-64px)]">
    <div class="container mx-auto px-4 py-6 max-w-4xl h-full flex flex-col">
        
        <div class="bg-white rounded-t-2xl shadow-sm border border-gray-200 p-4 flex items-center justify-between z-10">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center text-blue-600 font-bold">
                    {{ other_user.name[0]|upper }}
                </div>
                <div>
                    <h2 class="font-bold text-gray-800">{{ other_user.name }}</h2>
                    <p class="text-xs text-gray-500">{{ 'Phiên dịch viên' if other_user.role == 'translator' else 'Khách hàng' }}</p>
                </div>
            </div>
            {% if other_user.role == 'translator' %}
            <a href="{{ url_for('translator_profile', profile_id=other_user.profile.id) }}" class="text-sm text-blue-600 font-medium hover:underline border border-blue-200 px-3 py-1.5 rounded-lg bg-blue-50">Xem hồ sơ</a>
            {% endif %}
        </div>

        <div class="flex-grow bg-white border-x border-gray-200 overflow-hidden flex flex-col relative">
            
            <!-- Chat Box -->
            <div id="chat-box" class="flex-grow p-4 overflow-y-auto space-y-4 bg-gray-50/50">
                <!-- Messages go here via JS -->
            </div>
            
        </div>

        <div class="bg-white rounded-b-2xl shadow-sm border border-gray-200 p-3 z-10">
            <div class="flex gap-2">
                <input type="text" id="chat-input" class="flex-grow bg-gray-100 border-transparent focus:bg-white focus:border-blue-500 focus:ring-2 focus:ring-blue-200 rounded-xl px-4 py-3 text-sm transition" placeholder="Nhập tin nhắn để trao đổi công việc...">
                <button id="send-btn" class="bg-blue-600 text-white px-5 py-3 rounded-xl hover:bg-blue-700 transition flex items-center justify-center">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"></path></svg>
                </button>
            </div>
        </div>
        
    </div>
</div>

{% endblock %}
{% block scripts %}
<script>
    const otherUserId = {{ other_user.id }};
    const currentUserId = {{ current_user.id }};
    const chatBox = document.getElementById('chat-box');
    const chatInput = document.getElementById('chat-input');
    const sendBtn = document.getElementById('send-btn');
    
    function fetchMessages() {
        fetch(`/api/direct-messages/${otherUserId}`)
            .then(res => res.json())
            .then(data => {
                const isScrolledToBottom = chatBox.scrollHeight - chatBox.clientHeight <= chatBox.scrollTop + 1;
                chatBox.innerHTML = '';
                
                if (data.length === 0) {
                    chatBox.innerHTML = `
                        <div class="flex flex-col items-center justify-center h-full text-center text-gray-400 space-y-3">
                            <svg class="w-16 h-16 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                            <p class="text-sm">Chưa có tin nhắn nào.<br>Hãy gửi lời chào để bắt đầu trao đổi công việc!</p>
                        </div>
                    `;
                    return;
                }

                data.forEach(msg => {
                    const isMe = msg.sender_id === currentUserId;
                    const div = document.createElement('div');
                    div.className = `flex flex-col ${isMe ? 'items-end' : 'items-start'}`;
                    
                    div.innerHTML = `
                        <span class="text-[11px] text-gray-400 mb-1 px-1">${msg.time}</span>
                        <div class="px-4 py-2.5 rounded-2xl max-w-[85%] md:max-w-[70%] text-sm shadow-sm ${isMe ? 'bg-blue-600 text-white rounded-br-sm' : 'bg-white border border-gray-100 text-gray-800 rounded-bl-sm'}">
                            ${msg.content}
                        </div>
                    `;
                    chatBox.appendChild(div);
                });
                
                if (isScrolledToBottom) {
                    chatBox.scrollTop = chatBox.scrollHeight;
                }
            });
    }

    function sendMessage() {
        const text = chatInput.value.trim();
        if (!text) return;
        
        chatInput.value = ''; // clear immediately
        
        fetch(`/api/direct-messages/${otherUserId}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ content: text })
        }).then(() => {
            fetchMessages();
            setTimeout(() => { chatBox.scrollTop = chatBox.scrollHeight; }, 100);
        });
    }

    sendBtn.addEventListener('click', sendMessage);
    chatInput.addEventListener('keypress', e => {
        if (e.key === 'Enter') sendMessage();
    });

    fetchMessages();
    setInterval(fetchMessages, 3000);
</script>
{% endblock %}
