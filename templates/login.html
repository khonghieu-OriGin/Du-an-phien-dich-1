{% extends "base.html" %}

{% block content %}
<div class="container mx-auto px-4 py-12 flex justify-center">
    <div class="bg-white p-8 rounded-xl shadow-sm border border-gray-100 w-full max-w-md">
        <h2 class="text-2xl font-bold text-center mb-6">Đăng Nhập</h2>
        
        <!-- Mock Social Login -->
        <div class="space-y-3 mb-6">
            <button class="w-full border border-gray-300 text-gray-700 py-2.5 rounded-lg hover:bg-gray-50 flex items-center justify-center gap-2 transition">
                <svg class="w-5 h-5 text-red-500" fill="currentColor" viewBox="0 0 24 24"><path d="M12.48 10.92v3.28h7.84c-.24 1.84-.853 3.187-1.787 4.133-1.147 1.147-2.933 2.4-6.053 2.4-4.827 0-8.6-3.893-8.6-8.72s3.773-8.72 8.6-8.72c2.6 0 4.507 1.027 5.907 2.347l2.307-2.307C18.747 1.44 16.133 0 12.48 0 5.867 0 .307 5.387.307 12s5.56 12 12.173 12c3.573 0 6.267-1.173 8.373-3.36 2.16-2.16 2.84-5.213 2.84-7.667 0-.76-.053-1.467-.173-2.053H12.48z"/></svg>
                Đăng nhập bằng Google
            </button>
            <button class="w-full border border-gray-300 text-gray-700 py-2.5 rounded-lg hover:bg-gray-50 flex items-center justify-center gap-2 transition">
                <svg class="w-5 h-5 text-blue-600" fill="currentColor" viewBox="0 0 24 24"><path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.469h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.469h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/></svg>
                Đăng nhập bằng Facebook
            </button>
        </div>
        
        <div class="relative flex py-2 items-center mb-6">
            <div class="flex-grow border-t border-gray-200"></div>
            <span class="flex-shrink-0 mx-4 text-gray-400 text-sm">Hoặc đăng nhập bằng Email</span>
            <div class="flex-grow border-t border-gray-200"></div>
        </div>

        <form method="POST" action="{{ url_for('login') }}">
            <div class="mb-4">
                <label class="block text-gray-700 font-medium mb-2 text-sm">Email</label>
                <input type="email" name="email" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" value="hirer@test.com">
            </div>
            <div class="mb-6">
                <div class="flex justify-between mb-2">
                    <label class="block text-gray-700 font-medium text-sm">Mật khẩu</label>
                    <a href="#" class="text-sm text-blue-600 hover:underline">Quên mật khẩu?</a>
                </div>
                <input type="password" name="password" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" value="123456">
            </div>
            <button type="submit" class="w-full bg-blue-600 text-white font-bold py-3 rounded-lg hover:bg-blue-700 transition">
                Đăng Nhập
            </button>
        </form>
        
        <p class="text-center mt-6 text-gray-600 text-sm">
            Chưa có tài khoản? <a href="{{ url_for('register') }}" class="text-blue-600 font-medium hover:underline">Đăng ký ngay</a>
        </p>
    </div>
</div>
{% endblock %}
